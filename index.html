<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10251d" />
  <meta name="description" content="Arnemetia — procedural 3D fantasy action RPG web prototype." />
  <title>Arnemetia — Web Prototype</title>
  <link rel="stylesheet" href="./src/style.css" />
  <link rel="stylesheet" href="./src/ui/auth-screen.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <main id="game">
    <canvas id="world" aria-label="Arnemetia 3D game world"></canvas>
    <header class="topbar">
      <div class="identity">
        <div class="crest">A</div>
        <div><strong>ARNEMETIA</strong><small>WILDS · PROTOTYPE 0.1</small></div>
      </div>
      <button type="button" id="character-select-button" class="character-select-button">CHARACTER</button>
      <div class="player-meta">
        <span id="level">Lv. 1</span>
        <div class="xp-track"><div id="xp-fill"></div></div>
        <span id="xp-text">0 / 100 EXP</span>
      </div>
    </header>

    <section class="hud-left">
      <div class="stat-card">
        <div class="stat-heading"><span>HP</span><b id="hp-text">100 / 100</b></div>
        <div class="bar hp"><div id="hp-fill"></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-heading"><span>WEAPON</span><b id="weapon-name">WOODEN SWORD</b></div>
        <div class="weapon-row"><span id="weapon-icon">⚔</span><span id="weapon-style">Balanced melee</span></div>
      </div>
    </section>

    <section class="quest-card">
      <span class="eyebrow">FIELD TASK</span>
      <strong>First Hunt</strong>
      <span id="quest-progress">Defeat a slime (0/3)</span>
    </section>

    <div class="toast" id="toast" role="status">Welcome to Arnemetia</div>

    <section class="bottom-hud">
      <div class="weapon-picker">
        <span class="eyebrow">EQUIPPED WEAPON</span>
        <div class="weapon-buttons" id="weapon-buttons">
          <button class="weapon-button active" data-weapon="sword"><span>⚔</span><small>Sword</small></button>
          <button class="weapon-button" data-weapon="bow"><span>➶</span><small>Bow</small></button>
          <button class="weapon-button" data-weapon="staff"><span>✦</span><small>Staff</small></button>
          <button class="weapon-button" data-weapon="daggers"><span>⚔</span><small>Daggers</small></button>
        </div>
      </div>
      <div class="actions">
        <button id="attack" class="attack-button"><span>✦</span><b>ATTACK</b><small id="attack-hint">Tap to strike</small></button>
        <button id="skill" class="skill-button"><span>✧</span><b>SKILL</b><small id="skill-hint">Crescent Slash</small></button>
      </div>
    </section>
    <div class="move-hint">DRAG TO MOVE · TAP MONSTER TO TARGET</div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
